[package]
name = "artemis"
version = "0.1.0"
edition = "2024"
description = "3D-симулятор полёта по миссии NASA Artemis II"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { version = "0.18", features = ["mp3", "wav", "jpeg"] }
bevy_asset_loader = "0.26.0"
bevy_egui = "0.39.1"
bevy_panorbit_camera = { version = "0.34.0", features = ["bevy_egui"] }
bevy_rapier3d = "0.33.0"
directories = "6.0.0"
rand = "0.10.1"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }

# Быстрая компиляция в dev-режиме (рекомендация Bevy):
# наш код компилируется быстро, зависимости — с оптимизацией.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Релиз — максимальная оптимизация
[profile.release]
lto = "thin"
codegen-units = 1
